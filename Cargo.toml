[workspace]
members = [".", "tools/hl-input"]

[package]
name = "hullbreakers"
default-run = "hullbreakers"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["wayland", "wav"] }
avian3d = "0.7.0"
lightyear = { version = "0.30.1", features = ["netcode", "udp", "input_native"] }
bevy_egui = "0.42.0"
noise = "0.9.0"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.10"

[dev-dependencies]
# Lightyear's transports read the clock directly; tests drive a mock clock.
lightyear_core = { version = "0.30.1", features = ["test_utils"] }
mock_instant = "0.6"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
